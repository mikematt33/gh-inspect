name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Use the latest stable Go: the project targets 1.24+, but the pinned
          # golangci-lint version installed by `make lint` requires Go >= 1.25.
          go-version: "stable"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run Vet
        run: go vet ./...
      - name: Run Linter
        run: make lint

      - name: Run Tests
        run: make test

      - name: Build
        run: make build
